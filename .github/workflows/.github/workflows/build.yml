name: Build NEXTUP for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build NEXTUP.exe
        run: run: pyinstaller --noconfirm --clean --onefile --windowed --name NEXTUP launcher/nextup_launcher.py

