
name: Build NEXTUP for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find launcher file
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -File | Select-Object -ExpandProperty FullName
          $script = Get-ChildItem -Path . -Recurse -File -Filter "nextup_launcher.py" | Select-Object -First 1
          if (-not $script) {
            Write-Error "Could not find nextup_launcher.py in this repository."
            exit 1
          }
          "LAUNCHER_PATH=$($script.FullName)" >> $env:GITHUB_ENV

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build NEXTUP.exe
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NEXTUP "$env:LAUNCHER_PATH"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: NEXTUP-Windows
          path: dist/NEXTUP.exe
